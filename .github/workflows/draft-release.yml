name: Prepare draft GitHub release

# When a version change reaches main, prepare its GitHub release as a DRAFT.
# Publishing the release and submitting to Thunderbird Add-ons are explicit
# maintainer decisions after native Thunderbird platform checks.
on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/draft-release.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check source and YOURLS Helper
        run: |
          npm run check
          npm test
          php -l helper/kurl-helper/plugin.php
      - name: Package exactly the committed sources
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 scripts/build-xpi.py "kurl-thunderbird-${version}.xpi"
          git archive --format=zip --output="kurl-thunderbird-${version}-source.zip" HEAD
          sha256sum "kurl-thunderbird-${version}.xpi" "kurl-thunderbird-${version}-source.zip" > SHA256SUMS.txt
      - name: Create draft release with version notes and assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # Draft releases are not always returned by the tag lookup endpoint.
          # List releases to identify a draft by its requested tag name instead.
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n 1)"
          if [[ -n "$release_id" ]]; then
            draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.draft')"
            if [[ "$draft" != "true" ]]; then
              echo "Release $tag is already published; refusing to replace its assets."
              exit 0
            fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f name="kURL for Thunderbird ${VERSION}" \
              -f body="$(cat RELEASE_NOTES.md)" \
              -f target_commitish="$GITHUB_SHA" >/dev/null
            # Refresh only the draft's own assets; never rewrite a published release.
            for asset_id in $(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[].id'); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null
            done
            for file in "kurl-thunderbird-${VERSION}.xpi" "kurl-thunderbird-${VERSION}-source.zip" SHA256SUMS.txt; do
              gh api -X POST -H 'Content-Type: application/octet-stream' \
                --input "$file" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$file" >/dev/null
            done
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "kURL for Thunderbird ${VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --draft \
              "kurl-thunderbird-${VERSION}.xpi" \
              "kurl-thunderbird-${VERSION}-source.zip" \
              SHA256SUMS.txt
          fi
