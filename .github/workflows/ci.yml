name: Validate Thunderbird kURL
on:
  push:
    branches: [main, "audit/**", "feature/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: YOURLS Helper PHP syntax
        run: php -l helper/kurl-helper/plugin.php
      - name: Build and validate test XPI
        run: python3 scripts/build-xpi.py
      - uses: actions/upload-artifact@v4
        with:
          name: kurl-thunderbird-test-xpi
          path: kurl-thunderbird-*-test.xpi
