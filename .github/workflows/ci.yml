name: Validate Thunderbird kURL
on:
  push:
    branches: [main, "audit/**", "feature/**"]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: YOURLS Helper PHP syntax
        if: runner.os == 'Linux'
        run: php -l helper/kurl-helper/plugin.php
      - name: Build and validate test XPI
        run: python3 scripts/build-xpi.py
      - uses: actions/upload-artifact@v4
        with:
          name: kurl-thunderbird-${{ matrix.os }}-test-xpi
          path: kurl-thunderbird-*-test.xpi
